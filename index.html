<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilfunn – Hvem eier bilen?</title>
<meta name="description" content="Søk opp et norsk registreringsnummer og få tilgang til kjøretøy- og eieropplysninger. 3 kr for 3 dager, deretter 249 kr/mnd. Avslutt når du vil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0A2A55;          /* deep blue – brand surface */
  --deep-2:#08213F;        /* darker navy for footer */
  --cta:#1355C6;           /* CTA blue */
  --cta-press:#0F429B;
  --wash:#EDF1F7;          /* light blue/grey page background */
  --card:#FFFFFF;
  --ink:#121A26;
  --ink-2:#465266;
  --ink-3:#6C7789;
  --line:#D7DEE9;
  --line-2:#E8EDF4;
  --ok:#16704A;
  --ok-bg:#E5F3EC;
  --warn:#8A5300;
  --warn-bg:#FCF1DF;
  --bad:#A32020;
  --bad-bg:#FBE9E9;
  --plate-blue:#003399;
  --focus:#FFB400;
  --radius:10px;
  --radius-lg:14px;
  --shadow:0 1px 2px rgba(10,42,85,.06), 0 8px 24px -12px rgba(10,42,85,.18);
  --shadow-lg:0 2px 4px rgba(10,42,85,.07), 0 24px 48px -20px rgba(10,42,85,.30);
  --maxw:1120px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Archivo","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --deep:#0A2A55; --deep-2:#061A33;
    --cta:#2E6EE0; --cta-press:#2559BD;
    --wash:#0B1220; --card:#131C2C;
    --ink:#EAF0F9; --ink-2:#AEBBCE; --ink-3:#8797AE;
    --line:#26334A; --line-2:#1D2839;
    --ok:#6FD3A4; --ok-bg:#122C22;
    --warn:#E8B76A; --warn-bg:#2C2415;
    --bad:#F09191; --bad-bg:#2E1717;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 24px 48px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --deep:#0A2A55; --deep-2:#061A33;
  --cta:#2E6EE0; --cta-press:#2559BD;
  --wash:#0B1220; --card:#131C2C;
  --ink:#EAF0F9; --ink-2:#AEBBCE; --ink-3:#8797AE;
  --line:#26334A; --line-2:#1D2839;
  --ok:#6FD3A4; --ok-bg:#122C22;
  --warn:#E8B76A; --warn-bg:#2C2415;
  --bad:#F09191; --bad-bg:#2E1717;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 24px 48px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--wash); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column;
}
img{max-width:100%}
a{color:var(--cta); text-underline-offset:2px}
a:hover{color:var(--cta-press)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}
h1,h2,h3,h4{font-family:var(--display); margin:0 0 .4em; line-height:1.15; letter-spacing:-.01em; font-weight:700}
h1{font-size:clamp(1.9rem,1.3rem + 2.4vw,3rem); font-stretch:105%}
h2{font-size:clamp(1.35rem,1.1rem + 1vw,1.85rem)}
h3{font-size:1.1rem}
p{margin:0 0 1em}
.wrap{width:100%; max-width:var(--maxw); margin:0 auto; padding:0 20px}
.narrow{max-width:720px}
.mid{max-width:880px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.tiny{font-size:.8rem; color:var(--ink-3)}
.mono-num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header.site{background:var(--deep); color:#fff; position:sticky; top:0; z-index:40; border-bottom:1px solid rgba(255,255,255,.1)}
header.site .bar{display:flex; align-items:center; gap:16px; height:58px}
.brand{display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none; font-family:var(--display); font-weight:700; font-size:1.02rem; letter-spacing:-.01em}
.brandmark{width:34px;height:23px;border-radius:4px;background:#fff;display:flex;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.brandmark i{width:9px;background:var(--plate-blue);display:flex;align-items:flex-end;justify-content:center;color:#fff;font-style:normal;font-size:7px;font-weight:700;padding-bottom:2px}
.brandmark b{flex:1;display:flex;align-items:center;justify-content:center;color:var(--deep);font-family:var(--display);font-size:11px;font-stretch:112%;letter-spacing:.02em}
header.site nav{margin-left:auto; display:flex; align-items:center; gap:2px}
header.site nav a,header.site nav button{
  color:#DCE6F5; text-decoration:none; font-size:.9rem; padding:7px 11px; border-radius:7px;
  background:none; border:0; cursor:pointer; font-family:inherit
}
header.site nav a:hover,header.site nav button:hover{background:rgba(255,255,255,.12); color:#fff}
header.site nav a.on{color:#fff; background:rgba(255,255,255,.14)}
.navcta{background:#fff !important; color:var(--deep) !important; font-weight:600}
.lang{border:1px solid rgba(255,255,255,.3) !important; font-weight:600; font-size:.78rem !important; padding:5px 8px !important}
.menubtn{display:none}
@media(max-width:760px){
  header.site nav{position:fixed; inset:58px 0 auto 0; background:var(--deep); flex-direction:column; align-items:stretch; padding:8px 14px 16px; gap:2px; border-bottom:1px solid rgba(255,255,255,.15); display:none}
  header.site nav.open{display:flex}
  header.site nav a,header.site nav button{padding:12px; text-align:left; font-size:1rem}
  .menubtn{display:block; margin-left:auto}
}

/* ---------- hero ---------- */
.hero{background:linear-gradient(180deg,var(--deep) 0%,var(--deep) 62%,transparent 62%); padding:44px 0 0}
.hero .inner{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,420px); gap:40px; align-items:start}
.hero h1{color:#fff; margin-bottom:.35em}
.hero .lede{color:#C9D9F0; font-size:1.05rem; max-width:44ch}
.hero ul.assure{list-style:none; margin:22px 0 0; padding:0; display:grid; gap:9px; color:#D8E4F7; font-size:.92rem}
.hero ul.assure li{display:flex; gap:9px; align-items:flex-start}
.hero ul.assure svg{flex:none; margin-top:3px}
.searchcard{background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:22px; border:1px solid var(--line-2)}
@media(max-width:900px){
  .hero{padding-top:28px; background:linear-gradient(180deg,var(--deep) 0%,var(--deep) 78%,transparent 78%)}
  .hero .inner{grid-template-columns:1fr; gap:24px}
  .hero .lede{font-size:1rem}
  .hero ul.assure{display:none}
}

/* ---------- plate input ---------- */
.plate{display:flex; border:2px solid var(--ink); border-radius:9px; overflow:hidden; background:#fff; transition:border-color .12s}
.plate:focus-within{border-color:var(--cta); box-shadow:0 0 0 4px rgba(19,85,198,.16)}
.plate .eu{width:38px; background:var(--plate-blue); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:7px 0 6px; flex:none}
.plate .eu .stars{font-size:11px; line-height:1; letter-spacing:-1px}
.plate .eu .n{font-family:var(--display); font-weight:700; font-size:15px}
.plate input{
  flex:1; min-width:0; border:0; outline:0; background:#fff; color:#111;
  font-family:var(--display); font-weight:700; font-stretch:112%;
  font-size:clamp(1.5rem,1.1rem + 2vw,2.1rem); letter-spacing:.09em; text-transform:uppercase;
  padding:12px 10px; text-align:center;
}
.plate input::placeholder{color:#B9C2CE; letter-spacing:.06em}
.plate.err{border-color:var(--bad)}
.plate-static{display:inline-flex; align-items:center; border:2px solid #111; border-radius:6px; overflow:hidden; background:#fff}
.plate-static .eu{width:16px; background:var(--plate-blue); align-self:stretch; display:flex; align-items:flex-end; justify-content:center; color:#fff; font-size:7px; font-weight:700; padding-bottom:2px}
.plate-static span{font-family:var(--display); font-weight:700; font-stretch:110%; letter-spacing:.07em; color:#111; padding:3px 9px; font-size:.95rem}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  background:var(--cta); color:#fff; border:0; border-radius:9px; cursor:pointer;
  font-family:var(--sans); font-weight:600; font-size:1rem; padding:13px 20px; width:auto;
  text-decoration:none; transition:background .12s, transform .06s; line-height:1.2;
}
.btn:hover{background:var(--cta-press); color:#fff}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.btn.block{width:100%}
.btn.lg{padding:15px 22px; font-size:1.06rem}
.btn.ghost{background:transparent; color:var(--cta); border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--line-2); color:var(--cta-press)}
.btn.dark{background:var(--deep)}
.btn.dark:hover{background:var(--deep-2)}
.btn.danger{background:transparent; color:var(--bad); border:1.5px solid var(--bad)}
.btn.danger:hover{background:var(--bad-bg); color:var(--bad)}
.btn.sm{padding:8px 13px; font-size:.87rem; border-radius:8px}
.btn.vipps{background:#FF5B24}
.btn.vipps:hover{background:#E24E1B}
.linkbtn{background:none;border:0;color:var(--cta);cursor:pointer;font:inherit;font-size:.9rem;padding:0;text-decoration:underline}

/* ---------- cards / layout ---------- */
.page{flex:1; padding:32px 0 64px}
.page.tight{padding-top:22px}
.card{background:var(--card); border:1px solid var(--line-2); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:22px}
.card + .card{margin-top:16px}
.card h2,.card h3{margin-top:0}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.rowsplit{display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap}

dl.spec{margin:0; display:grid; grid-template-columns:minmax(120px,40%) 1fr; gap:0}
dl.spec dt,dl.spec dd{padding:9px 0; border-bottom:1px solid var(--line-2); margin:0; min-width:0}
dl.spec dt{color:var(--ink-2); font-size:.9rem}
dl.spec dd{font-weight:600; text-align:right; overflow-wrap:anywhere}
dl.spec dt:last-of-type,dl.spec dd:last-of-type{border-bottom:0}

.tag{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--line-2); color:var(--ink-2)}
.tag.ok{background:var(--ok-bg); color:var(--ok)}
.tag.warn{background:var(--warn-bg); color:var(--warn)}
.tag.bad{background:var(--bad-bg); color:var(--bad)}

.note{border-radius:var(--radius); padding:13px 15px; font-size:.9rem; border:1px solid var(--line); background:var(--line-2); color:var(--ink-2)}
.note.ok{background:var(--ok-bg); border-color:transparent; color:var(--ok)}
.note.warn{background:var(--warn-bg); border-color:transparent; color:var(--warn)}
.note.bad{background:var(--bad-bg); border-color:transparent; color:var(--bad)}
.note strong{color:inherit}

/* ---------- forms ---------- */
label.f{display:block; font-size:.88rem; font-weight:600; margin:0 0 6px}
.input,select.input,textarea.input{
  width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:9px;
  background:var(--card); color:var(--ink); font:inherit; font-size:1rem;
}
.input:focus{outline:0; border-color:var(--cta); box-shadow:0 0 0 4px rgba(19,85,198,.14)}
.input.bad{border-color:var(--bad)}
.field{margin-bottom:15px}
.err{color:var(--bad); font-size:.84rem; margin-top:5px; display:block}
.choice{display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--line); border-radius:10px; padding:13px; cursor:pointer; background:var(--card)}
.choice:hover{border-color:var(--ink-3)}
.choice.on{border-color:var(--cta); box-shadow:0 0 0 3px rgba(19,85,198,.13)}
.choice input{margin-top:3px; accent-color:var(--cta)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:.88rem; color:var(--ink-2)}
.check input{margin-top:3px; accent-color:var(--cta); width:17px; height:17px; flex:none}

/* ---------- paywall ---------- */
.locked{position:relative; overflow:hidden}
.locked .blur{filter:blur(6px); opacity:.5; user-select:none; pointer-events:none}
.locked .lockover{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,rgba(255,255,255,0) 0%,var(--card) 72%)}
.pricebox{border:1.5px solid var(--cta); border-radius:var(--radius-lg); overflow:hidden}
.pricebox .top{background:var(--cta); color:#fff; padding:15px 18px}
.pricebox .top .amt{font-family:var(--display); font-size:2.1rem; font-weight:800; line-height:1; font-stretch:105%}
.pricebox .body{padding:16px 18px; background:var(--card)}
.terms-list{list-style:none; margin:0; padding:0; display:grid; gap:9px; font-size:.9rem}
.terms-list li{display:flex; gap:9px; align-items:flex-start; color:var(--ink-2)}
.terms-list b{color:var(--ink)}

/* ---------- misc ---------- */
.steps{display:flex; gap:6px; align-items:center; font-size:.8rem; color:var(--ink-3); margin-bottom:18px; flex-wrap:wrap}
.steps span.on{color:var(--cta); font-weight:600}
.faq details{border-bottom:1px solid var(--line); padding:0}
.faq summary{cursor:pointer; padding:15px 2px; font-weight:600; list-style:none; display:flex; justify-content:space-between; gap:12px; align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; color:var(--cta); font-size:1.3rem; font-weight:400; line-height:1}
.faq details[open] summary::after{content:"–"}
.faq .ans{padding:0 2px 16px; color:var(--ink-2); font-size:.94rem; max-width:70ch}
.plates-cloud{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.plates-cloud button{background:none;border:0;padding:0;cursor:pointer}
.spinner{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner.blue{border-color:rgba(19,85,198,.25); border-top-color:var(--cta)}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%); background-size:400% 100%; animation:sk 1.3s ease infinite; border-radius:6px; height:13px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

table.data{width:100%; border-collapse:collapse; font-size:.88rem}
table.data th,table.data td{text-align:left; padding:9px 11px; border-bottom:1px solid var(--line-2); white-space:nowrap}
table.data th{color:var(--ink-2); font-weight:600; font-size:.8rem; background:var(--line-2)}
table.data tr:hover td{background:var(--line-2)}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}

.kpi{background:var(--card); border:1px solid var(--line-2); border-radius:var(--radius); padding:14px}
.kpi .v{font-family:var(--display); font-size:1.7rem; font-weight:700; line-height:1.1}
.kpi .l{font-size:.8rem; color:var(--ink-2)}

/* footer */
footer.site{background:var(--deep-2); color:#B9C9E0; padding:40px 0 26px; font-size:.87rem; margin-top:auto}
footer.site a{color:#D5E2F4; text-decoration:none}
footer.site a:hover{text-decoration:underline; color:#fff}
footer.site h4{color:#fff; font-size:.92rem; margin:0 0 12px}
footer.site .cols{display:grid; grid-template-columns:1.6fr 1fr 1fr 1.2fr; gap:28px}
footer.site ul{list-style:none; margin:0; padding:0; display:grid; gap:8px}
footer.site .legal{border-top:1px solid rgba(255,255,255,.14); margin-top:28px; padding-top:18px; color:#93A9C8; font-size:.8rem; max-width:80ch}
@media(max-width:760px){footer.site .cols{grid-template-columns:1fr 1fr; gap:22px}}

/* toast + modal + cookie */
#toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:90; display:grid; gap:8px; width:min(92vw,420px)}
.toast{background:var(--deep); color:#fff; padding:12px 15px; border-radius:10px; box-shadow:var(--shadow-lg); font-size:.9rem}
.toast.bad{background:var(--bad)}
.toast.ok{background:var(--ok)}
.modal{position:fixed; inset:0; z-index:100; background:rgba(8,20,38,.55); display:flex; align-items:center; justify-content:center; padding:18px}
.modal .box{background:var(--card); border-radius:var(--radius-lg); padding:24px; width:min(100%,460px); box-shadow:var(--shadow-lg); max-height:90vh; overflow:auto}
#cookiebar{position:fixed; left:0; right:0; bottom:0; z-index:80; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -8px 30px -18px rgba(10,42,85,.5); padding:16px 0}
#cookiebar .in{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
#cookiebar p{margin:0; font-size:.86rem; color:var(--ink-2); flex:1; min-width:260px}
@media print{header.site,footer.site,#cookiebar,.noprint{display:none !important} body{background:#fff}}
</style>
</head>
<body>
<a href="#main" class="sr">Hopp til innhold</a>
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="#/" id="brandlink">
      <span class="brandmark"><i>N</i><b>BF</b></span> Bilfunn
    </a>
    <button class="menubtn" id="menubtn" aria-label="Meny" aria-expanded="false">☰</button>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main" class="page"></main>
<footer class="site" id="footer"></footer>
<div id="toasts"></div>
<div id="modalroot"></div>
<div id="cookiebar" class="hide"></div>
<script>
"use strict";
/* =========================================================================
   Bilfunn — Norwegian vehicle ownership & information platform
   Working end-to-end prototype: search → preview → paywall → checkout →
   report → account → subscription lifecycle → admin.
   All data is simulated locally. No real personal data, no real payments.
   ========================================================================= */

/* ---------------------------- config ---------------------------------- */
const CFG_DEFAULT = {
  introPrice: 3,
  introDays: 3,
  renewPrice: 249,
  currency: "NOK",
  introSearchLimit: 10,
  monthlySearchLimit: 50,
  duplicatesCount: false,      // repeat lookup of same plate within 24h is free
  cancelKeepsAccess: true,     // access until end of paid period
  graceDays: 5,
  retrySchedule: [1, 3, 5],    // days after failed renewal
  reminderHoursBefore: 24,
  ipSearchesPerHour: 20,
  vatRate: 0.25
};

/* ---------------------------- storage --------------------------------- */
const KEY = "bilfunn.v1";
const blank = () => ({
  cfg: { ...CFG_DEFAULT },
  clockOffsetMs: 0,
  lang: "no",
  consent: null,            // {necessary, analytics, marketing, at}
  session: null,            // userId
  users: {},                // id -> user
  subs: {},                 // id -> subscription
  payments: [],
  searches: [],
  events: [],
  emails: [],
  tickets: [],
  pendingCode: null,
  lastReport: null,
  seeded: false
});
let S = blank();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) S = Object.assign(blank(), JSON.parse(raw));
    S.cfg = Object.assign({ ...CFG_DEFAULT }, S.cfg || {});
  } catch (e) { S = blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode */ }
}
function resetAll() { try { localStorage.removeItem(KEY); } catch (e) {} S = blank(); seed(); save(); }

/* ---------------------------- clock ----------------------------------- */
/* A shiftable clock so the 3-day period, renewal, dunning and cancellation
   can actually be exercised without waiting three days. */
const now = () => Date.now() + (S.clockOffsetMs || 0);
const DAY = 86400000, HOUR = 3600000;
function advanceDays(d) { S.clockOffsetMs = (S.clockOffsetMs || 0) + d * DAY; runBilling(); save(); }

/* ---------------------------- utils ----------------------------------- */
const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9);
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kr = (n) => new Intl.NumberFormat(S.lang === "en" ? "en-GB" : "nb-NO", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n) + " kr";
function fdate(ts, withTime) {
  const d = new Date(ts);
  const o = withTime
    ? { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }
    : { day: "2-digit", month: "short", year: "numeric" };
  return new Intl.DateTimeFormat(S.lang === "en" ? "en-GB" : "nb-NO", o).format(d);
}

function buildVehicle(plate) {
  const h = hashStr(plate);
  const [make, models] = pick(MAKES, h);
  const model = pick(models, h >> 3);
  const fuel = pick(FUELS, h >> 5);
  const isEV = fuel[0] === "Elektrisk";
  const year = 2006 + (h >> 7) % 19;
  const firstReg = new Date(Date.UTC(year, (h >> 11) % 12, 1 + (h >> 13) % 27));
  const col = pick(COLORS, h >> 9);
  const body = pick(BODIES, h >> 15);
  const owners = 1 + (h >> 17) % 5;
  const [zip, city] = pick(CITIES, h >> 19);
  const ownerName = pick(FIRSTNAMES, h >> 21) + " " + pick(LASTNAMES, h >> 23);
  const lastInsp = new Date(now() - ((h >> 4) % 900) * DAY);
  const nextInsp = new Date(lastInsp.getTime() + 730 * DAY);
  const inspOverdue = nextInsp.getTime() < now();
  const weight = 1150 + (h % 900);
  const power = isEV ? 100 + (h % 220) : 66 + (h % 160);
  const hist = [];
  let t = firstReg.getTime();
  for (let i = owners; i >= 1; i--) {
    const span = 300 + ((h >> (i * 2)) % 1400) * DAY / DAY * 1;
    hist.push({
      from: t,
      to: i === 1 ? null : t + span * DAY,
      name: i === 1 ? ownerName : pick(FIRSTNAMES, h >> (i * 3)) + " " + pick(LASTNAMES, h >> (i * 5)),
      type: (h >> (i + 6)) % 7 === 0 ? "company" : "person",
      city: pick(CITIES, h >> (i * 7))[1]
    });
    t += span * DAY;
    if (t > now()) { hist[hist.length - 1].to = null; break; }
  }
  const cur = hist[hist.length - 1];
  const imported = (h >> 25) % 5 === 0;
  return {
    plate,
    // free preview
    make, model, year,
    body: body, colorPair: col,
    // paid
    vin: "YV1" + String(h).slice(0, 5) + (make[0] + model[0]).toUpperCase() + String(h >> 3).slice(0, 6),
    fuelPair: fuel,
    firstReg: firstReg.getTime(),
    firstRegNo: imported ? firstReg.getTime() + (200 + h % 900) * DAY : firstReg.getTime(),
    imported,
    importFrom: imported ? pick(["Tyskland/Germany", "Sverige/Sweden", "Danmark/Denmark", "Nederland/Netherlands"], h >> 27) : null,
    gearbox: isEV ? ["Automat (1-trinn)", "Automatic (1-speed)"] : ((h >> 6) % 2 ? ["Manuell", "Manual"] : ["Automat", "Automatic"]),
    power, displacement: isEV ? null : 1200 + (h % 1800),
    co2: isEV ? 0 : 95 + (h % 120),
    euroClass: isEV ? "—" : "Euro " + (4 + (h >> 8) % 3),
    weight, maxWeight: weight + 480 + (h % 200),
    length: 4100 + (h % 900), width: 1730 + (h % 180), height: 1420 + (h % 300),
    seats: 5, axles: 2, towWeight: 700 + (h % 1100),
    tyreFront: (195 + (h % 5) * 10) + "/" + (45 + (h % 4) * 5) + "R" + (16 + h % 3),
    lastInspection: lastInsp.getTime(), nextInspection: nextInsp.getTime(), inspOverdue,
    regStatus: (h >> 29) % 9 === 0 ? ["Avregistrert", "Deregistered"] : ["Registrert", "Registered"],
    owners,
    ownerName: cur.name, ownerType: cur.type,
    ownerAddress: pick(STREETS, h >> 12) + " " + (1 + h % 70) + ", " + zip + " " + city,
    ownedSince: cur.from,
    history: hist,
    annualFee: isEV ? 0 : 2950 + (h % 600),
    lien: (h >> 31) % 4 === 0 ? { holder: pick(["Santander Consumer Bank", "Nordea Finans", "DNB Finans", "Møller Bilfinans"], h), amount: 40000 + (h % 250000) } : null
  };
}
/* deterministic "misses" so the not-found path is real */
function vehicleExists(plate) { return hashStr(plate + "#exists") % 17 !== 0; }

async function providerLookup(plate) {
  const t0 = performance.now();
  await sleep(420 + Math.random() * 520);
  const h = hashStr(plate + "#err");
  let res;
  if (h % 41 === 0) res = { ok: false, code: "provider_unavailable", status: 503 };
  else if (!vehicleExists(plate)) res = { ok: false, code: "not_found", status: 404 };
  else res = { ok: true, status: 200, vehicle: buildVehicle(plate) };
  res.ms = Math.round(performance.now() - t0);
  return res;
}

  };
  S.payments.unshift(p);

function accessOk(sub) {

  if (sub.status === "expired") return false;
  if (sub.status === "past_due") return now() < (sub.graceUntil || 0);
  if (sub.status === "canceled") return S.cfg.cancelKeepsAccess && now() < sub.periodEnd;
  return now() < sub.periodEnd;

/* Runs the billing lifecycle forward to the current (possibly shifted) time. */
function runBilling() {
  const t = now();
  Object.values(S.subs).forEach(sub => {
    const u = S.users[sub.userId]; if (!u) return;
    let guard = 0;
    // renewal reminder before first charge
    if (!sub.reminderSent && sub.status === "trialing" && t >= sub.periodEnd - S.cfg.reminderHoursBefore * HOUR) {
      sub.reminderSent = true; sendEmail("reminder", u.email, { renewAt: sub.periodEnd });
    }
    while ((sub.status === "trialing" || sub.status === "active") && t >= sub.periodEnd && guard++ < 40) {
      const p = charge(sub.userId, S.cfg.renewPrice, sub.status === "trialing" ? "first_renewal" : "renewal");
      track(p.status === "succeeded" ? "renewal_success" : "renewal_failure", { subId: sub.id, amount: p.amount });
      if (p.status === "succeeded") {
        sub.status = "active"; sub.renewals++; sub.periodStart = sub.periodEnd;
        sub.periodEnd = sub.periodEnd + 30 * DAY; sub.searchesThisPeriod = 0; sub.failedAttempts = 0;
        sendEmail("renewed", u.email, { amount: p.amount });
      } else {
        sub.status = "past_due"; sub.failedAttempts = 1;
        sub.graceUntil = t + S.cfg.graceDays * DAY;
        sub.nextRetryAt = t + S.cfg.retrySchedule[0] * DAY;
        sendEmail("failed", u.email, { until: sub.graceUntil });
      }
    }
    // dunning
    while (sub.status === "past_due" && sub.nextRetryAt && t >= sub.nextRetryAt && guard++ < 40) {
      const p = charge(sub.userId, S.cfg.renewPrice, "retry");
      if (p.status === "succeeded") {
        sub.status = "active"; sub.renewals++; sub.failedAttempts = 0; sub.graceUntil = null; sub.nextRetryAt = null;
        sub.periodStart = t; sub.periodEnd = t + 30 * DAY; sub.searchesThisPeriod = 0;
        sendEmail("renewed", u.email, { amount: p.amount });
      } else {
        sub.failedAttempts++;
        const next = S.cfg.retrySchedule[Math.min(sub.failedAttempts, S.cfg.retrySchedule.length) - 1];
        sub.nextRetryAt = t + next * DAY;
        if (sub.failedAttempts >= S.cfg.retrySchedule.length) { sub.status = "expired"; sub.nextRetryAt = null; }
      }
    }
    if (sub.status === "canceled" && t >= sub.periodEnd) sub.status = "expired";
    if (sub.status === "past_due" && sub.graceUntil && t >= sub.graceUntil && sub.failedAttempts >= S.cfg.retrySchedule.length) sub.status = "expired";
  });
  save();
}

function modal(html, onMount) {

  root.innerHTML = `<div class="modal"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`;

const routes = {};
function route(path, fn) { routes[path] = fn; }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { path, q: new URLSearchParams(qs || "") };
}
function render() {
  runBilling();
  const { path, q } = parseHash();
  const main = $("#main");

function wireSearch(scope) {
  const form = $("#searchform", scope); if (!form) return;
  const input = $("#plateinput", form);
  input.addEventListener("input", () => {
    const v = normalizePlate(input.value);
    input.value = /^[A-ZÆØÅ]{2}\d+$/.test(v) ? v.slice(0, 2) + " " + v.slice(2) : v;
    $("#plateerr").classList.add("hide"); $("#platewrap").classList.remove("err");
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const p = normalizePlate(input.value);

    if (!p) { errEl.textContent = T("err.empty"); errEl.classList.remove("hide"); $("#platewrap").classList.add("err"); input.focus(); return; }
    if (!plateKind(p)) { errEl.textContent = T("err.format"); errEl.classList.remove("hide"); $("#platewrap").classList.add("err"); input.focus(); track("search_invalid", { plate: p }); return; }

}

            <input class="input" id="ccard" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" maxlength="23">
            <span class="err hide" id="ecard"></span>
          </div>
          <div class="grid g2" style="gap:12px">
            <div class="field"><label class="f" for="cexp">${L("Utløp", "Expiry")}</label>
              <input class="input" id="cexp" inputmode="numeric" placeholder="MM/ÅÅ" maxlength="5"><span class="err hide" id="eexp"></span></div>
            <div class="field"><label class="f" for="ccvc">CVC</label>
              <input class="input" id="ccvc" inputmode="numeric" placeholder="123" maxlength="4"><span class="err hide" id="ecvc"></span></div>
          </div>
        </div>

        <label class="check" style="margin:4px 0 16px">
          <input type="checkbox" id="cterms"><span>${T("co.terms")}</span>
        </label>
        <span class="err hide" id="eterms" style="margin:-10px 0 12px;display:block"></span>

        <button class="btn block lg" type="submit" id="paybtn">${T("co.pay")}</button>
        <p class="tiny" style="text-align:center;margin:12px 0 0">${ICON.lock} ${L("Kortopplysninger lagres aldri hos oss. Betalingen håndteres av betalingsleverandøren.", "Card details are never stored by us. Payment is handled by the payment provider.")}</p>
      </form>
      <p class="tiny" style="margin-top:16px;border-top:1px solid var(--line-2);padding-top:12px">
        ${L("Demo: ingen ekte betaling skjer. Bruk kortnummer 4242 4242 4242 4242 for godkjent betaling, eller 4000 0000 0000 0002 for avvist betaling.", "Demo: no real payment happens. Use card 4242 4242 4242 4242 for approval, or 4000 0000 0000 0002 for decline.")}
      </p>
    </div></div>`;

  const setMethod = (v) => {
    $("#mVipps").classList.toggle("on", v === "vipps");
    $("#mCard").classList.toggle("on", v === "card");
    $("#vippsFields").classList.toggle("hide", v !== "vipps");
    $("#cardFields").classList.toggle("hide", v !== "card");
  };
  m.querySelectorAll('input[name=pm]').forEach(r => r.onchange = () => setMethod(r.value));
  $("#ccard").addEventListener("input", e => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 19).replace(/(.{4})/g, "$1 ").trim();
  });
  $("#cexp").addEventListener("input", e => {
    let d = e.target.value.replace(/\D/g, "").slice(0, 4);
    e.target.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
  });
  $("#cphone").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 8); });

  $("#cform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const method = m.querySelector('input[name=pm]:checked').value;
    const email = $("#cemail").value.trim();
    let bad = false;
    const fail = (id, msg) => { const el = $("#" + id); el.textContent = msg; el.classList.remove("hide"); bad = true; };
    m.querySelectorAll(".err").forEach(el => el.classList.add("hide"));
    if (!validEmail(email)) fail("eemail", L("Skriv inn en gyldig e-postadresse.", "Enter a valid email address."));
    let last4 = "", declined = false;
    if (method === "card") {
      const num = $("#ccard").value.replace(/\s/g, "");
      if (!luhn(num)) fail("ecard", L("Kortnummeret er ikke gyldig.", "That card number is not valid."));
      else { last4 = num.slice(-4); declined = num === "4000000000000002"; }
      const exp = $("#cexp").value;
      const mm = +exp.slice(0, 2), yy = +exp.slice(3);
      if (!/^\d{2}\/\d{2}$/.test(exp) || mm < 1 || mm > 12) fail("eexp", L("Ugyldig utløpsdato.", "Invalid expiry date."));
      else if (new Date(2000 + yy, mm, 1).getTime() < now()) fail("eexp", L("Kortet er utløpt.", "The card has expired."));
      if (!/^\d{3,4}$/.test($("#ccvc").value)) fail("ecvc", L("Ugyldig CVC.", "Invalid CVC."));
    } else {
      if (!/^[49]\d{7}$/.test($("#cphone").value)) fail("ephone", L("Skriv inn et norsk mobilnummer på 8 siffer.", "Enter an 8-digit Norwegian mobile number."));
      last4 = $("#cphone").value.slice(-4);
      declined = $("#cphone").value === "40000000";
    }
    if (!$("#cterms").checked) fail("eterms", L("Du må godta vilkårene for å fortsette.", "You must accept the terms to continue."));
    if (bad) { track("checkout_error", { field: "validation" }); m.querySelector(".err:not(.hide)").scrollIntoView({ block: "center", behavior: "smooth" }); return; }

    const btn = $("#paybtn");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${method === "vipps" ? L("Venter på Vipps …", "Waiting for Vipps …") : L("Behandler betaling …", "Processing payment …")}`;
    await sleep(method === "vipps" ? 1500 : 1100);

    if (declined) {
      btn.disabled = false; btn.textContent = T("co.pay");
      track("checkout_error", { reason: "declined" });
      $("#cform").insertAdjacentHTML("afterbegin", `<div class="note bad" style="margin-bottom:14px">${L("Betalingen ble avvist av utstederen. Prøv en annen betalingsmåte eller kontakt banken din.", "The payment was declined by the issuer. Try another payment method or contact your bank.")}</div>`);
      return;
    }

    // account: create or link
    let user = Object.values(S.users).find(x => x.email.toLowerCase() === email.toLowerCase());
    if (!user) {
      user = { id: uid("u"), email, createdAt: now(), method, last4, role: "customer", forceFail: false };
      S.users[user.id] = user;
      sendEmail("welcome", email, {});
      track("account_created", { userId: user.id });
    } else { user.method = method; user.last4 = last4; }
    S.session = user.id;

    let sub = subOf(user);
    if (!sub || sub.status === "expired") sub = createSubscription(user.id, method);
    const pay = charge(user.id, S.cfg.introPrice, "intro");
    sendEmail("payment_ok", email, { amount: S.cfg.introPrice, receipt: pay.receipt });
    sendEmail("subscription", email, { renewAt: sub.periodEnd });
    track("checkout_completed", { amount: S.cfg.introPrice, method, plate });
    countSearch(user, plate);
    const s0 = S.searches.find(s => s.plate === plate && !s.userId);
    if (s0) { s0.userId = user.id; s0.counted = true; }
    save();
    go("#/kvittering?nr=" + plate);
  });
});

      <p class="tiny" id="demohint" style="margin-top:10px"></p>

    const code = String(100000 + Math.floor(Math.random() * 899999));

    sendEmail("login_code", email, { code });
    $("#codebox").classList.remove("hide");
    $("#demohint").textContent = L("Demo: koden er " + code, "Demo: the code is " + code);
    $("#lcode").focus();
    track("login_code_sent", {});
  };
  $("#verify").onclick = () => {
    const pc = S.pendingCode;

      $("#elcode").textContent = L("Koden er feil eller utløpt.", "The code is wrong or expired."); $("#elcode").classList.remove("hide"); return;

    S.session = user.id; S.pendingCode = null; save();
    track("login_success", {});
    toast(L("Du er logget inn.", "You are logged in."), "ok");
    go("#/konto");
  };
});

function changeMethod(u) {
  modal(`<h2 style="font-size:1.2rem">${L("Endre betalingsmåte", "Change payment method")}</h2>
    <div class="field"><label class="f" for="nm">${L("Nytt kortnummer", "New card number")}</label>
      <input class="input" id="nm" inputmode="numeric" placeholder="4242 4242 4242 4242"><span class="err hide" id="nmErr"></span></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn sm ghost" id="mNo">${L("Avbryt", "Cancel")}</button>
      <button class="btn sm" id="mYes">${L("Lagre", "Save")}</button></div>`, () => {
    $("#mNo").onclick = closeModal;
    $("#mYes").onclick = () => {
      const n = $("#nm").value.replace(/\s/g, "");
      if (!luhn(n)) { $("#nmErr").textContent = L("Kortnummeret er ikke gyldig.", "That card number is not valid."); $("#nmErr").classList.remove("hide"); return; }
      u.method = "card"; u.last4 = n.slice(-4); u.forceFail = (n === "4000000000000002");
      const sub = subOf(u);
      if (sub && sub.status === "past_due" && !u.forceFail) { sub.nextRetryAt = now(); runBilling(); }
      save(); closeModal(); toast(L("Betalingsmåten er oppdatert.", "Payment method updated."), "ok"); render();
    };
  });

function cancelFlow(u, sub) {

    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn sm ghost" id="mNo">${L("Behold abonnementet", "Keep subscription")}</button>
      <button class="btn sm danger" id="mYes">${L("Bekreft oppsigelse", "Confirm cancellation")}</button></div>`, () => {
    $("#mNo").onclick = closeModal;
    $("#mYes").onclick = () => {

function kpi(v, l) { return `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`; }
function adminOverview(el) {
  const subs = Object.values(S.subs);
  const active = subs.filter(s => ["trialing", "active"].includes(s.status)).length;
  const paying = subs.filter(s => s.status === "active").length;
  const canceled = subs.filter(s => ["canceled", "expired"].includes(s.status)).length;
  const ok = S.payments.filter(p => p.status === "succeeded");
  const failed = S.payments.filter(p => p.status === "failed");
  const rev = ok.reduce((a, p) => a + p.amount - p.refunded, 0);
  const mrr = paying * S.cfg.renewPrice;
  const views = S.events.filter(e => e.name === "paywall_viewed").length;
  const buys = S.events.filter(e => e.name === "checkout_completed").length;
  const conv = views ? Math.round(buys / views * 100) : 0;
  const trialConv = subs.length ? Math.round(subs.filter(s => s.renewals > 0).length / subs.length * 100) : 0;
  el.innerHTML = `<div class="grid g3" style="margin-bottom:16px">
      ${kpi(Object.keys(S.users).length, L("Kunder", "Customers"))}
      ${kpi(active, L("Aktive abonnement", "Active subscriptions"))}
      ${kpi(kr(mrr), "MRR")}
      ${kpi(kr(rev), L("Omsetning totalt", "Total revenue"))}
      ${kpi(conv + " %", L("Betalingsmur → kjøp", "Paywall → purchase"))}
      ${kpi(trialConv + " %", L("Intro → betalende", "Intro → paying"))}
      ${kpi(failed.length, L("Mislykkede betalinger", "Failed payments"))}
      ${kpi(canceled, L("Oppsagt/utløpt", "Cancelled/expired"))}
      ${kpi(S.searches.length, L("Søk", "Searches"))}

    <div class="card"><h3>${L("Trakt siste periode", "Funnel this period")}</h3>
    <div class="scrollx"><table class="data"><tbody>
      ${[["home_view", L("Forsidevisning", "Homepage view")], ["search_started", L("Søk startet", "Search started")], ["vehicle_found", L("Kjøretøy funnet", "Vehicle found")],

    const p = S.payments.find(x => x.id === b.dataset.ref); p.refunded = p.amount;
    const u = S.users[p.userId]; if (u) sendEmail("refund", u.email, { amount: p.amount });
    track("refund_issued", { amount: p.amount }); save(); render(); toast(L("Refusjon registrert.", "Refund recorded."), "ok");
  });
}
function adminSearches(el) {
  const byIp = {};
  S.searches.forEach(s => { byIp[s.ip] = (byIp[s.ip] || 0) + 1; });
  const flagged = Object.entries(byIp).filter(([, n]) => n > S.cfg.ipSearchesPerHour * 0.75);
  el.innerHTML = `${flagged.length ? `<div class="note warn" style="margin-bottom:14px">${L("Høy søkeaktivitet", "High search volume")}: ${flagged.map(([ip, n]) => esc(ip) + " (" + n + ")").join(", ")}</div>` : ""}
    <div class="card"><h3>${L("Søkelogg", "Search log")}</h3>
    <div class="scrollx"><table class="data"><thead><tr>
      <th>${L("Tid", "Time")}</th><th>${L("Skilt", "Plate")}</th><th>${L("Resultat", "Result")}</th><th>${L("Svartid", "Latency")}</th><th>${L("Kunde", "Customer")}</th><th>IP</th><th>${L("Teller", "Counts")}</th></tr></thead>
      <tbody>${S.searches.slice(0, 60).map(s => { const u = S.users[s.userId]; return `<tr>
        <td>${fdate(s.at, true)}</td><td>${esc(prettyPlate(s.plate))}</td>
        <td>${s.result === "found" ? `<span class="tag ok">found</span>` : `<span class="tag ${s.result === "not_found" ? "" : "bad"}">${esc(s.result)}</span>`}</td>
        <td class="mono-num">${s.ms} ms</td><td>${esc(u ? u.email : "—")}</td><td>${esc(s.ip)}</td><td>${s.counted ? L("ja", "yes") : L("nei", "no")}</td></tr>`; }).join("")}
      </tbody></table></div></div>`;
}
function adminApi(el) {
  const last = S.searches.slice(0, 50);
  const errs = last.filter(s => s.result !== "found");
  const avg = last.length ? Math.round(last.reduce((a, s) => a + s.ms, 0) / last.length) : 0;
  const un = last.filter(s => s.result === "provider_unavailable").length;
  el.innerHTML = `<div class="grid g3" style="margin-bottom:16px">
      ${kpi(last.length, L("Kall (siste 50)", "Calls (last 50)"))}
      ${kpi(avg + " ms", L("Snitt svartid", "Average latency"))}
      ${kpi(last.length ? Math.round(errs.length / last.length * 100) + " %" : "0 %", L("Uten treff/feil", "No match/error"))}
      ${kpi(un, L("Leverandør nede", "Provider unavailable"))}
    </div>
    <div class="card"><h3>${L("Integrasjon", "Integration")}</h3>
    <dl class="spec">
      <dt>${L("Leverandør", "Provider")}</dt><dd>${L("Simulert adapter (byttes med reell leverandør)", "Simulated adapter (swap for real provider)")}</dd>
      <dt>${L("Endepunkt", "Endpoint")}</dt><dd>GET /api/vehicle/:plate</dd>
      <dt>${L("Mellomlagring", "Caching")}</dt><dd>${L("Av – avklares mot leverandørvilkår", "Off – to be cleared against provider terms")}</dd>
      <dt>${L("Tidsavbrudd", "Timeout")}</dt><dd>4000 ms</dd>
      <dt>${L("Nøkkelrotasjon", "Key rotation")}</dt><dd>${L("90 dager", "90 days")}</dd>
    </dl>
    <p class="tiny" style="margin-top:10px">${L("Feltene normaliseres til én intern modell, slik at leverandøren kan byttes uten endringer i grensesnittet.", "Fields are normalised into one internal model so the provider can be swapped without interface changes.")}</p></div>`;
}
function adminEmail(el) {
  el.innerHTML = `<div class="card"><h3>${L("Utgående e-post", "Outbound email")}</h3>
    <p class="muted small">${L("Alle transaksjonelle e-poster tjenesten har sendt.", "All transactional emails the service has sent.")}</p>
    ${S.emails.length ? S.emails.slice(0, 30).map(e => `<div style="border-bottom:1px solid var(--line-2);padding:10px 0">
      <div class="rowsplit"><strong>${esc(e.subject)}</strong><span class="tiny">${fdate(e.at, true)}</span></div>
      <div class="tiny">${L("Til", "To")}: ${esc(e.to)} · ${esc(e.type)}</div>
      <div class="small muted" style="margin-top:4px">${esc(e.body)}</div></div>`).join("")
      : `<p class="muted small">${L("Ingen e-post sendt ennå.", "No emails sent yet.")}</p>`}</div>`;
}
function adminTickets(el) {
  el.innerHTML = `<div class="card"><h3>${L("Henvendelser", "Support tickets")}</h3>
    ${S.tickets.length ? S.tickets.map(t => `<div style="border-bottom:1px solid var(--line-2);padding:10px 0">
      <div class="rowsplit"><strong>${esc(t.name)} · ${esc(t.email)}</strong><span class="tiny">${fdate(t.at, true)}</span></div>
      <div class="tiny">${esc(t.cat)}</div><div class="small muted" style="margin-top:4px">${esc(t.msg)}</div></div>`).join("")
      : `<p class="muted small">${L("Ingen henvendelser.", "No tickets.")}</p>`}</div>`;
}
function adminEvents(el) {
  el.innerHTML = `<div class="card"><h3>${L("Hendelseslogg", "Event log")}</h3>
    <p class="muted small">${L("Hendelser sendes til analyseverktøy kun når brukeren har samtykket. «Sendt = nei» betyr at samtykke manglet.", "Events are sent to analytics only when the user has consented. “Sent = no” means consent was missing.")}</p>
    <div class="scrollx"><table class="data"><thead><tr><th>${L("Tid", "Time")}</th><th>${L("Hendelse", "Event")}</th><th>${L("Data", "Props")}</th><th>${L("Sendt", "Sent")}</th></tr></thead>
    <tbody>${S.events.slice(0, 60).map(e => `<tr><td>${fdate(e.at, true)}</td><td>${esc(e.name)}</td>
      <td style="white-space:normal">${esc(JSON.stringify(e.props))}</td><td>${e.sent ? L("ja", "yes") : L("nei", "no")}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function adminSettings(el) {
  const f = (k, label, type) => `<div class="field"><label class="f" for="cfg_${k}">${label}</label>
    <input class="input" id="cfg_${k}" value="${S.cfg[k]}" ${type === "num" ? 'inputmode="numeric"' : ""}></div>`;
  el.innerHTML = `<div class="card"><h3>${L("Kommersielle regler", "Commercial rules")}</h3>
    <p class="muted small">${L("Abonnementsreglene er konfigurerbare, slik brief-en krever – ingen av dem er hardkodet i grensesnittet.", "Subscription rules are configurable, as the brief requires – none of them are hard-coded in the interface.")}</p>
    <div class="grid g2" style="gap:0 16px">
      ${f("introPrice", L("Introduksjonspris (kr)", "Introductory price (NOK)"), "num")}
      ${f("introDays", L("Introduksjonsdager", "Introductory days"), "num")}
      ${f("renewPrice", L("Månedspris (kr)", "Monthly price (NOK)"), "num")}
      ${f("introSearchLimit", L("Søk i introperioden", "Searches in intro period"), "num")}
      ${f("monthlySearchLimit", L("Søk per måned", "Searches per month"), "num")}
      ${f("graceDays", L("Nådedager ved mislykket betaling", "Grace days on failed payment"), "num")}
      ${f("ipSearchesPerHour", L("Søk per IP per time", "Searches per IP per hour"), "num")}
      ${f("reminderHoursBefore", L("Påminnelse (timer før)", "Reminder (hours before)"), "num")}
    </div>
    <label class="check" style="margin:6px 0"><input type="checkbox" id="cfg_dup" ${S.cfg.duplicatesCount ? "checked" : ""}><span>${L("Gjentatte søk på samme skilt teller mot grensen", "Repeat searches of the same plate count toward the limit")}</span></label>
    <label class="check" style="margin:0 0 14px"><input type="checkbox" id="cfg_keep" ${S.cfg.cancelKeepsAccess ? "checked" : ""}><span>${L("Ved oppsigelse beholdes tilgangen ut betalt periode", "On cancellation, access continues until the end of the paid period")}</span></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" id="savecfg">${L("Lagre innstillinger", "Save settings")}</button>
      <button class="btn sm ghost" id="seedbtn">${L("Legg inn demodata", "Load demo data")}</button>
      <button class="btn sm danger" id="wipebtn">${L("Nullstill alt", "Reset everything")}</button>
    </div></div>
    <div class="card"><h3>${L("Administratorer", "Administrators")}</h3>
    <div class="scrollx"><table class="data"><thead><tr><th>${L("Navn", "Name")}</th><th>E-post</th><th>${L("Rolle", "Role")}</th></tr></thead>
    <tbody><tr><td>Support</td><td>support@bilfunn.no</td><td>${L("Kundeservice", "Support")}</td></tr>
    <tr><td>Finans</td><td>faktura@bilfunn.no</td><td>${L("Økonomi", "Finance")}</td></tr>
    <tr><td>Personvern</td><td>personvern@bilfunn.no</td><td>${L("Personvernansvarlig", "Privacy")}</td></tr></tbody></table></div>
    <p class="tiny" style="margin-top:10px">${L("Alle administratorhandlinger logges med bruker, tidspunkt og hva som ble endret.", "All admin actions are logged with user, timestamp and what changed.")}</p></div>`;
  $("#savecfg").onclick = () => {
    ["introPrice", "introDays", "renewPrice", "introSearchLimit", "monthlySearchLimit", "graceDays", "ipSearchesPerHour", "reminderHoursBefore"]
      .forEach(k => { const v = +$("#cfg_" + k).value; if (!isNaN(v)) S.cfg[k] = v; });
    S.cfg.duplicatesCount = $("#cfg_dup").checked;
    S.cfg.cancelKeepsAccess = $("#cfg_keep").checked;
    save(); toast(L("Innstillingene er lagret.", "Settings saved."), "ok"); render();
  };
  $("#seedbtn").onclick = () => { seedDemo(); toast(L("Demodata lagt inn.", "Demo data loaded.")); render(); };
  $("#wipebtn").onclick = () => { resetAll(); adminOk = true; toast(L("Alt er nullstilt.", "Everything reset.")); go("#/admin"); };
}

/* ============================== seed ================================== */
function seed() { if (!S.seeded) { S.seeded = true; save(); } }
function seedDemo() {
  const mk = (email, daysAgo, status, renewals, fail) => {
    const u = { id: uid("u"), email, createdAt: now() - daysAgo * DAY, role: "customer", method: renewals ? "card" : "vipps", last4: String(1000 + Math.floor(Math.random() * 8999)), forceFail: !!fail };
    S.users[u.id] = u;
    const sub = {
      id: uid("sub"), userId: u.id, status, method: u.method,
      startedAt: u.createdAt, periodStart: now() - 2 * DAY,
      periodEnd: status === "expired" ? now() - DAY : now() + (status === "trialing" ? 1 : 22) * DAY,
      price: S.cfg.renewPrice, renewals, failedAttempts: status === "past_due" ? 1 : 0,
      graceUntil: status === "past_due" ? now() + 3 * DAY : null,
      nextRetryAt: status === "past_due" ? now() + DAY : null,
      searchesThisPeriod: Math.floor(Math.random() * 8), reminderSent: true, cancelAt: null, canceledAt: status === "canceled" ? now() - DAY : null
    };
    S.subs[sub.id] = sub; u.subId = sub.id;
    S.payments.push({ id: uid("pay"), userId: u.id, amount: 3, vat: .6, kind: "intro", at: u.createdAt, status: "succeeded", method: u.method, last4: u.last4, receipt: "BF-" + (10000 + S.payments.length), refunded: 0 });
    for (let i = 0; i < renewals; i++) S.payments.push({ id: uid("pay"), userId: u.id, amount: S.cfg.renewPrice, vat: 49.8, kind: "renewal", at: u.createdAt + (3 + i * 30) * DAY, status: "succeeded", method: u.method, last4: u.last4, receipt: "BF-" + (10000 + S.payments.length), refunded: 0 });
    if (status === "past_due") S.payments.unshift({ id: uid("pay"), userId: u.id, amount: S.cfg.renewPrice, vat: 49.8, kind: "renewal", at: now() - 2 * DAY, status: "failed", error: "insufficient_funds", method: u.method, last4: u.last4, receipt: "BF-" + (10000 + S.payments.length), refunded: 0 });
    RECENT.slice(0, 3 + Math.floor(Math.random() * 4)).forEach((p, i) =>
      S.searches.push({ id: uid("s"), plate: p, result: i === 2 ? "not_found" : "found", ms: 400 + Math.floor(Math.random() * 600), at: now() - Math.random() * 5 * DAY, userId: u.id, ip: "10.20.4." + (10 + i), counted: true }));
  };
  mk("kari.nordmann@example.no", 1, "trialing", 0);
  mk("ola.hansen@example.no", 40, "active", 1);
  mk("thea.berg@example.no", 95, "active", 3);
  mk("jonas.lie@example.no", 34, "past_due", 1, true);
  mk("ingrid.moen@example.no", 61, "canceled", 1);
  mk("emil.solberg@example.no", 120, "expired", 2);
  S.tickets.unshift({ id: uid("t"), name: "Ingrid Moen", email: "ingrid.moen@example.no", cat: L("Abonnement og oppsigelse", "Subscription and cancellation"), msg: L("Jeg sa opp i går, men vil vite om jeg fortsatt har tilgang ut perioden.", "I cancelled yesterday but want to know if I still have access for the rest of the period."), at: now() - 6 * HOUR, status: "open" });
  S.searches.sort((a, b) => b.at - a.at);
  ["home_view", "search_started", "vehicle_found", "paywall_viewed", "checkout_started", "checkout_completed", "report_viewed"].forEach((n, i) => {
    for (let k = 0; k < (14 - i * 2); k++) S.events.push({ id: uid("ev"), name: n, props: {}, at: now() - Math.random() * 3 * DAY, sent: true });
  });
  S.events.sort((a, b) => b.at - a.at);
  save();
}

/* ============================== boot ================================== */
load();
document.documentElement.lang = S.lang === "no" ? "no" : "en";
seed();
runBilling();
window.addEventListener("hashchange", render);
$("#menubtn").onclick = () => {
  const n = $("#nav"); const open = n.classList.toggle("open");
  $("#menubtn").setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#/']");
  if (a) { $("#nav").classList.remove("open"); }
});
renderAll();

</script>
