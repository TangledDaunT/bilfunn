name: Production checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sk_test
          POSTGRES_PASSWORD: test-only-database-password
          POSTGRES_DB: sk_test
        ports: ["55473:5432"]
        options: >-
          --health-cmd "pg_isready -U sk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bilfunn-prod
    env:
      TEST_DATABASE_URL: postgresql://sk_test:test-only-database-password@127.0.0.1:55473/sk_test?connection_limit=10
      TEST_DIRECT_URL: postgresql://sk_test:test-only-database-password@127.0.0.1:55473/sk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bilfunn-prod/package-lock.json
      - run: npm ci
      - run: npm run security:secrets
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/test-local.mjs migrate
      - run: node scripts/test-local.mjs test
      - run: node scripts/test-local.mjs build
      - run: npx playwright install --with-deps chromium
      - run: PRODUCTION_E2E=1 node scripts/test-local.mjs e2e
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
